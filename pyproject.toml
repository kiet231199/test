[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-checker"
version = "0.1.0"
description = "Standalone media metric checker for raw and encoded video"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "av==17.1.0",
    "numpy==1.24.4",
    "PyYAML==6.0.3",
]

[project.scripts]
media-check = "media_checker.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
